name: Verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wrl_test
          POSTGRES_PASSWORD: synthetic_test_only
          POSTGRES_DB: gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wrl_test -d gateway_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    env:
      DATABASE_URL: postgres://wrl_test:synthetic_test_only@127.0.0.1:5432/gateway_test
      RECEIVER_DATABASE_URL: postgres://wrl_test:synthetic_test_only@127.0.0.1:5432/receiver_test
      TEST_DATABASE_URL: postgres://wrl_test:synthetic_test_only@127.0.0.1:5432/gateway_test
      TEST_RECEIVER_DATABASE_URL: postgres://wrl_test:synthetic_test_only@127.0.0.1:5432/receiver_test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Static checks and compilation
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run build

      - name: Unit suite with machine-readable report
        run: npm run test:unit -- --reporter=json --outputFile=unit-results.json

      - name: Initialize fresh receiver database
        run: node scripts/ci/init-test-receiver-db.mjs

      - name: Apply both PostgreSQL migrations
        run: |
          npm run migrate
          npm run migrate:receiver

      - name: PostgreSQL integration suite with machine-readable report
        run: npm run test:integration -- --reporter=json --outputFile=integration-results.json

      - name: Reject omissions and incomplete suites
        run: node scripts/ci/check-test-reports.mjs unit-results.json integration-results.json

      - name: End-to-end recovery demo over real HTTP and two databases
        run: npm run demo:scenario -- --run-id ci

      - name: Build and start isolated Compose stack
        env:
          COMPOSE_PROJECT_NAME: wrl-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose up --build -d db migrate api receiver worker

      - name: Check containerized HTTP and durable delivery
        env:
          COMPOSE_PROJECT_NAME: wrl-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/ci/check-compose-smoke.mjs

      - name: Capture Compose diagnostics on failure
        if: failure()
        env:
          COMPOSE_PROJECT_NAME: wrl-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker compose ps
          docker compose logs --no-color --tail 120

      - name: Stop only this CI Compose stack
        if: always()
        env:
          COMPOSE_PROJECT_NAME: wrl-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose down --remove-orphans
